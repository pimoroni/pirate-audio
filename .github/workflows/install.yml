name: Install Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  trixie:
    name: ${{ matrix.name }} on Raspberry Pi OS Trixie
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie-slim
    env:
      TERM: xterm-256color
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mopidy/install.sh
            test: install-trixie.sh
          - name: clip-recorder/install.sh
            test: install-clip-recorder-trixie.sh

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Run the install test
        run: bash "tests/${{ matrix.test }}" "$GITHUB_WORKSPACE"
